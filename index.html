<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TusukKoffe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        
        <div class="login-header">
            <h2>Tusuk<span>Koffe</span>.</h2>
            <p>Satu tusuk kenikmatan, sejuta inspirasi.</p>
        </div>

        
        <form action="#" method="POST" class="login-form">
            <div class="form-group">
                <label for="username">Email atau Username</label>
                <input type="text" id="username" name="username" placeholder="contoh@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>

            
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Ingat Saya
                </label>
                
                <a href="#" class="forgot-link">Lupa Password?</a>
            </div>

            
            <button type="submit" class="btn-login">Masuk</button>
        </form>

        
        <div class="login-footer">
            <p>Belum punya akun? <a href="#" class="register-link">Bikin Akun Baru</a></p>
        </div>
    </div>

</body>
</html>
